[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "falsify"
version = "0.3.0"
description = "Popper — falsify the spec, then verify the proof. An executable spec-faithfulness oracle for math and code, built on AXLE."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aravind Kannappan" }]
keywords = ["formal-methods", "lean", "autoformalization", "specification", "verification", "axiom", "axle", "verina"]
dependencies = []  # core is pure standard library by design

[project.optional-dependencies]
live = ["axiom-axle"]      # live AXLE audit (Lean checking over the API)
llm = ["anthropic"]        # LLM-driven declarative spec repair (M2 → live)
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/aravinds-kannappan/Popper"
AXLE = "https://axle.axiommath.ai"

[project.scripts]
falsify-audit-math = "examples.audit_math:main"
falsify-audit-code = "examples.audit_verina:main"
falsify-repair = "examples.repair_demo:main"
falsify-verina-live = "examples.verina_live_audit:main"
falsify-scale = "examples.scale_demo:main"

[tool.setuptools.packages.find]
include = ["falsify*"]
